<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini Game</title>
<script src="https://js.stripe.com/v3/"></script>
<style>
:root{--bg1:#141a2e;--bg2:#2a1f3d;--card:#1d2540;--line:#2f3a5f;--text:#e8edf2;--mut:#9aa7b4;--dia:#3fa9f5;--coi:#c0c7d0;--gld:#f5c542}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,sans-serif;color:var(--text);background:linear-gradient(135deg,var(--bg1),var(--bg2))}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;color:var(--text)}
.hidden{display:none!important}
#login{display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;min-height:100vh}
#login input{padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:16px}
.primary{background:#4f6bff;padding:12px 22px;font-weight:600}
.bar{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:16px}
.chip{position:relative;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 12px}
.ic{width:22px;height:22px;vertical-align:middle}.ic.s{width:14px;height:14px}
.chip b{min-width:40px;text-align:right}
.plus{width:28px;height:28px;border-radius:50%;background:#4f6bff;font-size:18px;line-height:1;padding:0}
.pop{position:absolute;top:calc(100% + 8px);left:0;z-index:5;min-width:220px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px}
.pop button{background:#2a3560;padding:10px 12px;text-align:left;display:flex;justify-content:space-between;gap:12px}
.pop small{color:var(--mut)}
main{display:flex;flex-direction:column;align-items:center;gap:16px;padding:8px 16px 40px}
.hero{width:min(300px,80vw);filter:drop-shadow(0 20px 30px #0008)}
.who{color:var(--mut)}
#shop{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.panel{background:var(--bg1);border:1px solid var(--line);border-radius:24px;width:min(900px,100%);max-height:90vh;display:flex;flex-direction:column}
.panel header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;padding:0 20px 12px}
.tabs button{background:var(--card);padding:8px 14px}
.tabs button.on{background:#4f6bff}
.grid{overflow:auto;padding:0 20px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:8px}
.card img{width:100%;border-radius:12px}
.card .n{font-weight:600}
.buy{display:flex;flex-direction:column;gap:6px}
.buy button{padding:8px;font-weight:600;background:#2a3560;display:flex;align-items:center;justify-content:center;gap:6px}
.buy button[data-c=DIA]{color:var(--dia)}.buy button[data-c=COI]{color:var(--coi)}.buy button[data-c=GLD]{color:var(--gld)}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#000c;padding:12px 18px;border-radius:12px;z-index:40}
#pay{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:16px;background:#0008;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.paybox{position:relative;width:min(460px,100%);max-height:85vh;overflow:auto;background:#fff;border-radius:20px;padding:16px;box-shadow:0 30px 80px #000a}
#closePay{position:absolute;top:8px;right:8px;z-index:2;width:32px;height:32px;border-radius:50%;background:#e8e8ef;color:#222;padding:0;font-size:16px}
#checkout{margin-top:24px}
</style></head>
<body>
<section id="login">
  <h1>Mini Game</h1>
  <input id="name" placeholder="Player name (a-z, 0-9, _)" maxlength="30">
  <button class="primary" id="enter">Enter</button>
</section>

<section id="game" class="hidden">
  <div class="bar" id="bar"></div>
  <main>
    <svg class="hero" viewBox="0 0 256 256" aria-label="character">
      <defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a1f2a"/><stop offset="1" stop-color="#7a3b55"/></linearGradient></defs>
      <rect width="256" height="256" rx="24" fill="url(#hg)"/>
      <circle cx="128" cy="92" r="30" fill="#e0b894"/>
      <path d="M92 92 Q92 52 128 52 Q164 52 164 92 Z" fill="#9aa7b4"/>
      <rect x="76" y="128" width="104" height="96" rx="22" fill="#5a6b4a"/>
      <rect x="112" y="128" width="32" height="40" fill="#4b5663"/>
    </svg>
    <div class="who" id="who"></div>
    <button class="primary" id="openShop">Магазин</button>
  </main>
</section>

<section id="shop" class="hidden">
  <div class="panel">
    <header><h2 style="margin:0">Магазин</h2><button id="closeShop" style="background:#2a3560;padding:8px 14px">✕</button></header>
    <div class="tabs" id="tabs"></div>
    <div class="grid" id="grid"></div>
  </div>
</section>
<section id="pay" class="hidden">
  <div class="paybox"><button id="closePay" aria-label="Close">✕</button><div id="checkout"></div></div>
</section>
<div id="toast" class="hidden"></div>

<script>
const $ = s => document.querySelector(s);
const svgUri = x => 'data:image/svg+xml;utf8,' + encodeURIComponent(x);
const ICONS = {
  DIA: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><polygon points="16,10 48,10 60,26 32,58 4,26" fill="#3fa9f5"/><polygon points="16,10 32,26 4,26" fill="#7cc7ff"/><polygon points="48,10 60,26 32,26" fill="#2b86d1"/><polygon points="16,10 48,10 32,26" fill="#a8dcff"/><polygon points="4,26 32,26 32,58" fill="#2f8fe0"/><polygon points="60,26 32,26 32,58" fill="#1f6fb5"/></svg>`,
  COI: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="#9aa7b4"/><circle cx="32" cy="32" r="28" fill="none" stroke="#e8edf2" stroke-width="3"/><circle cx="32" cy="32" r="20" fill="#c0c7d0" stroke="#6f7c89" stroke-width="2"/><path d="M32 18 L36 28 L47 29 L39 36 L41 46 L32 41 L23 46 L25 36 L17 29 L28 28 Z" fill="#6f7c89"/></svg>`,
  GLD: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><polygon points="6,50 14,34 50,34 58,50" fill="#d4a017"/><polygon points="14,34 50,34 46,28 18,28" fill="#ffe27a"/><polygon points="6,50 58,50 58,54 6,54" fill="#a67c00"/><polygon points="20,28 44,28 40,14 24,14" fill="#f5c542"/><polygon points="24,14 40,14 38,10 26,10" fill="#ffe27a"/></svg>`
};
const CUR = { DIA: { n: 'Diamonds', i: svgUri(ICONS.DIA) }, COI: { n: 'Coins', i: svgUri(ICONS.COI) }, GLD: { n: 'Gold', i: svgUri(ICONS.GLD) } };
let stripe = null, checkout = null;
let player = null, packages = [], items = [], cats = [], tab = 'all';

async function api(url, opt) {
  const r = await fetch(url, opt), t = await r.text();
  let d = null; try { d = t ? JSON.parse(t) : null; } catch {}
  if (!r.ok) throw new Error((d && d.error) || ('Error ' + r.status));
  return d;
}
const post = (u, b, h = {}) => api(u, { method: 'POST', headers: { 'Content-Type': 'application/json', ...h }, body: JSON.stringify(b) });
const acc = c => player.accounts.find(a => a.currency === c);
const fmt = n => Number(n).toLocaleString('ru-RU', { maximumFractionDigits: 2 });
const esc = s => String(s).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.remove('hidden'); setTimeout(() => t.classList.add('hidden'), 3000); }

async function openPlayer(name) {
  player = await post('/api/players/open', { name });
  localStorage.setItem('player', player.name);
  $('#login').classList.add('hidden'); $('#game').classList.remove('hidden');
  $('#who').textContent = player.name;
  renderBar();
}

function renderBar() {
  const bar = $('#bar'); bar.innerHTML = '';
  for (const code of Object.keys(CUR)) {
    const chip = document.createElement('div'); chip.className = 'chip';
    chip.innerHTML = `<img class="ic" src="${CUR[code].i}" alt="${code}"><b>${fmt(acc(code).balance)}</b>`;
    const plus = document.createElement('button'); plus.className = 'plus'; plus.textContent = '+';
    plus.onclick = e => { e.stopPropagation(); togglePop(chip, code); };
    chip.appendChild(plus); bar.appendChild(chip);
  }
}

function togglePop(chip, code) {
  const old = chip.querySelector('.pop'); closePops();
  if (old) return;
  const pop = document.createElement('div'); pop.className = 'pop';
  const list = packages.filter(p => p.rewardCurrency === code);
  if (!list.length) pop.textContent = 'Нет пакетов';
  for (const p of list) {
    const b = document.createElement('button');
    b.innerHTML = `<span>${esc(p.name)}<br><small>+${fmt(p.rewardAmount)} <img class="ic s" src="${CUR[code].i}" alt="${code}"></small></span><b>$${fmt(p.priceUsd)}</b>`;
    b.onclick = () => buyPackage(p);
    pop.appendChild(b);
  }
  chip.appendChild(pop);
}
const closePops = () => document.querySelectorAll('.pop').forEach(p => p.remove());
document.addEventListener('click', closePops);

async function buyPackage(p) {
  try {
    const r = await post('/api/purchases', { playerUsdAccountId: acc('USD').id, playerRewardAccountId: acc(p.rewardCurrency).id, packageId: p.id });
    if (!r.publishableKey) throw new Error('Нет Stripe:PublishableKey: проверь User Secrets и PurchasesController');
    closePops(); closePay();
    $('#pay').classList.remove('hidden');
    stripe = Stripe(r.publishableKey);
    checkout = await stripe.initEmbeddedCheckout({ fetchClientSecret: async () => r.clientSecret, onComplete: refreshAfterPay });
    checkout.mount('#checkout');
  } catch (e) { closePay(); toast(e.message); }
}
function closePay() {
  if (checkout) { checkout.destroy(); checkout = null; }
  $('#pay').classList.add('hidden');
}
async function refreshAfterPay() {
  for (let i = 0; i < 6; i++) { await new Promise(r => setTimeout(r, 1500)); await openPlayer(player.name); }
}
$('#closePay').onclick = closePay;

async function openShop() {
  if (!items.length) { [items, cats] = await Promise.all([api('/api/items'), api('/api/items/categories')]); }
  $('#shop').classList.remove('hidden'); renderShop();
}
function renderShop() {
  const tabs = $('#tabs'); tabs.innerHTML = '';
  for (const c of [{ id: 'all', name: 'Все' }, ...cats]) {
    const b = document.createElement('button'); b.textContent = c.name; if (c.id === tab) b.className = 'on';
    b.onclick = () => { tab = c.id; renderShop(); }; tabs.appendChild(b);
  }
  $('#grid').innerHTML = items.filter(i => tab === 'all' || i.categoryId === tab).map(i => `
    <div class="card"><img src="${esc(i.imageUrl)}" alt=""><div class="n">${esc(i.name)}</div>
    <div class="buy">${i.prices.map(p => `<button data-i="${esc(i.id)}" data-c="${p.currency}"><img class="ic" src="${CUR[p.currency].i}" alt="${p.currency}"> ${fmt(p.amount)}</button>`).join('')}</div></div>`).join('');
}
$('#grid').onclick = async e => {
  const b = e.target.closest('button'); if (!b) return;
  try {
    await post(`/api/items/${b.dataset.i}/buy`, { playerAccountId: acc(b.dataset.c).id, currency: b.dataset.c }, { 'Idempotency-Key': crypto.randomUUID() });
    toast('Куплено!'); await openPlayer(player.name);
  } catch (err) { toast(err.message); }
};

$('#openShop').onclick = () => openShop().catch(e => toast(e.message));
$('#closeShop').onclick = () => $('#shop').classList.add('hidden');
$('#enter').onclick = () => start($('#name').value.trim());
$('#name').onkeydown = e => { if (e.key === 'Enter') start($('#name').value.trim()); };

async function start(name) {
  try {
    packages = await api('/api/packages');
    await openPlayer(name);
    if (new URLSearchParams(location.search).has('paid')) {
      toast('Оплата принята, обновляю баланс...');
      history.replaceState(null, '', '/');
      for (let i = 0; i < 6; i++) { await new Promise(r => setTimeout(r, 1500)); await openPlayer(name); }
    }
  } catch (e) { toast(e.message); }
}
const saved = localStorage.getItem('player'); if (saved) start(saved);
</script>
</body></html>
